name: pgTAP Security Tests

# Executa os testes pgTAP do banco sempre que migrations ou testes mudam.
# Valida: SEC-004/005/006/008/009 (trigger, block_delivery_funds, protect_delivery_columns,
# REVOKE finalize, terminal-state protection).
#
# Para disparar manualmente: Actions → pgTAP Security Tests → Run workflow.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
  workflow_dispatch:

jobs:
  pgtap-security-tests:
    name: Run pgTAP security tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Instala a Supabase CLI oficial.
      # A versão "latest" rastreia a CLI estável mais recente.
      # Para fixar: with: version: 2.116.0
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Sobe o stack local: Postgres + pgTAP + PostgREST + Auth.
      # Migrations de supabase/migrations/ são aplicadas automaticamente em ordem cronológica.
      # Exclui serviços desnecessários para testes de banco:
      #   edge-runtime  — Deno runtime para Edge Functions
      #   imgproxy      — redimensionamento de imagens
      #   inbucket      — servidor de email local (SMTP fake)
      - name: Start Supabase local stack
        run: supabase start --exclude edge-runtime,imgproxy,inbucket

      # Executa todos os .sql em supabase/tests/ usando pgTAP.
      # Arquivos executados nesta ordem (alfabética):
      #   accept_delivery_atomic_test.sql
      #   add_restaurant_funds_permissions_test.sql
      #   delivery_security_test.sql         ← 18 assertions SEC-004/005/006/008/009
      #   protect_wallet_balance_test.sql
      #
      # Cada arquivo roda dentro de uma transação revertida ao final (ROLLBACK),
      # deixando o banco limpo para o próximo arquivo.
      #
      # Saída: formato TAP (Test Anything Protocol).
      # Exit code 0 = todos PASS; exit code não-zero = ao menos um FAIL.
      - name: Run pgTAP tests
        run: supabase test db

      # Para o stack local para liberar recursos do runner.
      # --no-backup pula o dump de dados de desenvolvimento (não necessário em CI).
      # Roda sempre, mesmo que os testes falhem, para não vazar containers.
      - name: Stop Supabase local stack
        if: always()
        run: supabase stop --no-backup

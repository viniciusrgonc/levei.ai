name: pgTAP Security Tests

# Executa os testes pgTAP do banco sempre que migrations ou testes mudam.
# Valida: SEC-004/005/006/008/009 (trigger, block_delivery_funds, protect_delivery_columns,
# REVOKE finalize, terminal-state protection).
#
# Para disparar manualmente: Actions → pgTAP Security Tests → Run workflow.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
  workflow_dispatch:

jobs:
  pgtap-security-tests:
    name: Run pgTAP security tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Instala a Supabase CLI oficial.
      # A versão "latest" rastreia a CLI estável mais recente.
      # Para fixar: with: version: 2.116.0
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Remove qualquer estado residual de runs anteriores no mesmo runner
      # (volumes Docker sujos podem fazer o Postgres iniciar em recovery mode).
      - name: Clean up any leftover Supabase state
        run: supabase stop --no-backup 2>/dev/null || true

      # Sobe o stack local: Postgres + pgTAP + PostgREST + Auth.
      # Migrations de supabase/migrations/ são aplicadas automaticamente em ordem cronológica.
      # Exclui serviços desnecessários para testes de banco.
      - name: Start Supabase local stack
        run: supabase start --exclude edge-runtime,imgproxy,inbucket,storage,realtime,vector

      # Aguarda o Postgres sair do recovery mode antes de rodar os testes.
      # pg_is_in_recovery() = 'f' confirma que o banco está como primary
      # (aceita escritas). SELECT 1 passaria mesmo em recovery mode (read-only),
      # por isso usamos essa query específica.
      - name: Wait for Postgres to leave recovery mode
        run: |
          echo "Waiting for Postgres to become primary (not in recovery)..."
          for i in $(seq 1 60); do
            result=$(PGPASSWORD=postgres psql -h localhost -p 54322 -U postgres -d postgres \
              -t -c "SELECT pg_is_in_recovery()" 2>/dev/null | tr -d ' \n')
            if [ "$result" = "f" ]; then
              echo "Postgres is primary and ready after ${i} attempts"
              exit 0
            fi
            echo "Attempt ${i}/60: pg_is_in_recovery=${result:-unavailable}, waiting 2s..."
            sleep 2
          done
          echo "ERROR: Postgres did not become primary after 120 seconds"
          exit 1

      # Executa todos os .sql em supabase/tests/ usando pgTAP.
      - name: Run pgTAP tests
        run: supabase test db

      # Para o stack local para liberar recursos do runner.
      - name: Stop Supabase local stack
        if: always()
        run: supabase stop --no-backup
